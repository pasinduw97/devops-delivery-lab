name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Unit and HTTP integration tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible Lambda package
        run: python scripts/package_lambda.py
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false
      - name: Terraform checks without AWS credentials
        run: |
          terraform -chdir=infra fmt -check
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
      - name: Container build and smoke test
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          docker build --pull -t releaseops:test .
          docker run -d --name releaseops --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=100 --memory=128m --cpus=0.5 -p 127.0.0.1:8080:8080 -e APP_VERSION="$APP_VERSION" releaseops:test
          python scripts/smoke.py http://127.0.0.1:8080 --expected-version "$APP_VERSION"
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs releaseops || true
          docker rm -f releaseops || true
